name: Mirror SOL history to GitHub
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental or backfill'
        required: true
        default: incremental
        type: choice
        options: [incremental, backfill]
permissions:
  contents: write
concurrency:
  group: sol-history-mirror
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - id: plan
        env:
          MIRROR_MODE: ${{ inputs.mode || 'incremental' }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os
          today = dt.datetime.now(dt.timezone.utc).date()
          if os.environ['MIRROR_MODE'] == 'backfill':
              first = dt.date(2026, 10, 1)
              width = 3
          else:
              first = today - dt.timedelta(days=2)
              width = 3
          chunks = []
          day = first
          while day <= today:
              end = min(day + dt.timedelta(days=width-1), today)
              chunks.append({'start': day.isoformat(), 'end': end.isoformat()})
              day = end + dt.timedelta(days=1)
          print('chunks=' + json.dumps(chunks, separators=(',', ':')))
          PY
  mirror:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Mirror D1 rows (small pages, retry on disconnect)
        env:
          HISTORY_READ_TOKEN: ${{ secrets.HISTORY_READ_TOKEN }}
          MIRROR_MODE: ${{ inputs.mode || 'incremental' }}
          HISTORY_START_DATE: ${{ matrix.chunk.start }}
          HISTORY_END_DATE: ${{ matrix.chunk.end }}
        run: |
          test -n "$HISTORY_READ_TOKEN" || { echo 'Missing HISTORY_READ_TOKEN repository secret'; exit 1; }
          python3 scripts/mirror_history.py
      - name: Commit only changed history files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/
          if git diff --cached --quiet; then
            echo 'No history changes to commit'
            exit 0
          fi
          git commit -m 'Update SOL historical market and DOA snapshots'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'History files conflict with upstream; refusing to overwrite'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'History mirror pushed successfully'
              exit 0
            fi
            echo "Concurrent push detected (attempt $attempt/5); retrying"
            sleep $((attempt * 2))
          done
          echo 'Unable to push history after five attempts'
          exit 1
